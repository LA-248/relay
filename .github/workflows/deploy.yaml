name: Deploy

run-name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  increment-server-tag:
    uses: ./.github/workflows/increment-tag.yaml
    with:
      tag-prefix: server

  increment-client-tag:
    uses: ./.github/workflows/increment-tag.yaml
    with:
      tag-prefix: client

  build-server:
    runs-on: ubuntu-latest
    needs: increment-server-tag
    defaults:
      run:
        working-directory: ./server

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22.20"
      - run: npm ci
      - run: npm run build

  build-client:
    runs-on: ubuntu-latest
    needs: increment-client-tag
    defaults:
      run:
        working-directory: ./client

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22.20"
      - run: npm ci
      - run: npm run build

  build-and-push-server-image:
    uses: ./.github/workflows/build-and-push-image.yaml
    with:
      image_tag: ${{ needs.increment-server-tag.outputs.latest_tag }}
      working_directory: ./server
    secrets:
      ECR_REPO: ${{ secrets.ECR_REPO }}

    needs:
      - build-server
      - increment-server-tag

  build-and-push-client-image:
    uses: ./.github/workflows/build-and-push-image.yaml
    with:
      image_tag: ${{ needs.increment-client-tag.outputs.latest_tag }}
      working_directory: ./client
    secrets:
      ECR_REPO: ${{ secrets.ECR_REPO }}

    needs:
      - build-client
      - increment-client-tag
